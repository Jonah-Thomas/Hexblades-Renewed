plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

version = "${mc_version}-${mod_version}"
group = "${mod_group_id}"
archivesBaseName = mod_id

sourceSets {
    main.resources.srcDirs += 'src/generated/resources'
}

minecraft {
    mappings channel: 'official', version: "${mc_version}"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            jvmArgs '-Xmx4G', '-Xms2G', '-XX:+IgnoreUnrecognizedVMOptions'
            arg "-mixin.config=hexblades.mixins.json"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { hexblades { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            jvmArgs '-Xmx4G', '-Xms2G', '-XX:+IgnoreUnrecognizedVMOptions'
            arg "-mixin.config=hexblades.mixins.json"
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { hexblades { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            jvmArgs '-Xmx4G', '-Xms2G', '-XX:+IgnoreUnrecognizedVMOptions'
            args '--mod', 'hexblades', '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods { hexblades { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url 'https://maven.parchmentmc.org' }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven {
        name 'JEI maven'
        url = "https://maven.blamejared.com"
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // GeckoLib 4
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${mc_version}:${geckolib_version}")

    // Curios
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // JEI
    compileOnly fg.deobf("curse.maven:jei-238222:7920915")

    // Eidolon-Repraised (required)
    implementation fg.deobf("curse.maven:eidolon-repraised-870250:7674316")

    // Optional compat APIs (compile-time only, runtime-optional)
    compileOnly fg.deobf("curse.maven:botania-225643:7982360")
    compileOnly fg.deobf("curse.maven:malum-484064:6646111")
    compileOnly fg.deobf("curse.maven:ars-nouveau-401955:6688854")
    compileOnly fg.deobf("curse.maven:lodestone-616457:6213794")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mc_version   : mc_version,
        forge_version: forge_version,
        mod_version  : mod_version,
        mod_id       : mod_id,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : "alexthw",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "alexthw",
            "MixinConfigs"            : "hexblades.mixins.json",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
    repositories {
        maven { url "file:///${project.projectDir}/mcmodsrepo" }
    }
}

mixin {
    add sourceSets.main, "hexblades.refmap.json"
}
